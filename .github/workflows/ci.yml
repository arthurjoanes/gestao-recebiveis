name: Gestão de recebíveis checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      COMPOSE_PROJECT_NAME: pf-gestao-recebiveis
      DEMO_MODE: "true"
      FRONTEND_ORIGIN: http://localhost:3101
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Create temporary credentials
        shell: bash
        run: |
          session_secret="$(openssl rand -hex 48)"
          database_password="$(openssl rand -hex 24)"
          echo "::add-mask::$session_secret"
          echo "::add-mask::$database_password"
          echo "SESSION_SECRET=$session_secret" >> "$GITHUB_ENV"
          echo "DATABASE_PASSWORD=$database_password" >> "$GITHUB_ENV"
          for key in DATABASE_OWNER_PASSWORD DATABASE_APP_PASSWORD; do
            value="$(openssl rand -hex 24)"
            echo "::add-mask::$value"
            echo "$key=$value" >> "$GITHUB_ENV"
          done
      - name: Build application and checks
        run: |
          for service in db api frontend frontend-checks e2e; do
            docker compose --profile test build "$service"
          done
      - name: Backend checks on PostgreSQL
        run: |
          docker compose run --rm test
          docker compose up -d --wait --force-recreate db-upgrade-test
          docker compose run --rm --no-deps upgrade-test
      - name: Scan runtime images
        run: |
          mkdir -p artifacts/security
          for component in backend frontend database; do
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$PWD/artifacts/security:/reports" \
              aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969 \
              image --scanners vuln --ignorefile /dev/null --exit-code 1 \
              --format json --output "/reports/$component.json" \
              "gestao-recebiveis-$component:local"
          done
      - name: Frontend lint and types
        run: docker compose run --rm --no-deps frontend-checks
      - name: Migrate and seed isolated browser stack
        run: |
          docker compose -f compose.yaml -f compose.e2e.yaml -p pf-gestao-recebiveis-e2e up -d --wait db
          docker compose -f compose.yaml -f compose.e2e.yaml -p pf-gestao-recebiveis-e2e run --rm migrate
          docker compose -f compose.yaml -f compose.e2e.yaml -p pf-gestao-recebiveis-e2e run --rm --no-deps seed
      - name: Start isolated application
        run: docker compose -f compose.yaml -f compose.e2e.yaml -p pf-gestao-recebiveis-e2e up -d --wait --wait-timeout 180 api worker frontend
      - name: Browser journey
        run: docker compose -f compose.yaml -f compose.e2e.yaml -p pf-gestao-recebiveis-e2e run --rm --no-deps e2e
      - name: Save browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-evidence
          path: |
            artifacts/e2e
            artifacts/security
          if-no-files-found: ignore
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose --profile test logs --tail 200
          docker compose -f compose.yaml -f compose.e2e.yaml -p pf-gestao-recebiveis-e2e --profile test logs --tail 200
          docker compose -f compose.yaml -f compose.e2e.yaml -p pf-gestao-recebiveis-e2e --profile test --profile tools down --remove-orphans
          docker compose stop db-test db-upgrade-test
