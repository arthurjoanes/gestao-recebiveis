name: pf-gestao-recebiveis

x-backend: &backend
  image: gestao-recebiveis-backend:local
  build:
    context: .
    dockerfile: backend/Dockerfile
  init: true
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://gestao_recebiveis:${DATABASE_PASSWORD:?Execute scripts/gestao-recebiveis.ps1 setup para criar .env}@db:5432/gestao_recebiveis
    DEMO_MODE: ${DEMO_MODE:-true}
    SESSION_SECRET: ${SESSION_SECRET:?Execute scripts/gestao-recebiveis.ps1 setup para criar .env}
    FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3101}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    MAX_ATTEMPTS: ${MAX_ATTEMPTS:-5}
    LEASE_SECONDS: ${LEASE_SECONDS:-60}
    HEARTBEAT_SECONDS: ${HEARTBEAT_SECONDS:-20}
    WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-1}
    DEMO_RETRY_BASE_SECONDS: ${DEMO_RETRY_BASE_SECONDS:-1}
  networks: [gestao_recebiveis]

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: gestao_recebiveis
      POSTGRES_USER: gestao_recebiveis
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?Execute scripts/gestao-recebiveis.ps1 setup para criar .env}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gestao_recebiveis -d gestao_recebiveis"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [gestao_recebiveis]
    restart: unless-stopped

  migrate:
    <<: *backend
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    ports:
      - "127.0.0.1:${API_PORT:-8101}:8101"
    command: [uvicorn, "gestao_recebiveis.app:app", --host, "0.0.0.0", --port, "8101"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    <<: *backend
    command: [python, -m, gestao_recebiveis.worker]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    image: gestao-recebiveis-frontend:local
    build:
      context: ./frontend
      target: runtime
      args:
        API_INTERNAL_URL: http://api:8101
    init: true
    environment:
      API_INTERNAL_URL: http://api:8101
      NODE_ENV: production
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3101}:3101"
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3101').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    depends_on:
      api:
        condition: service_healthy
    networks: [gestao_recebiveis]
    restart: unless-stopped

  seed:
    <<: *backend
    profiles: [tools]
    command: [python, -m, gestao_recebiveis.seed]
    depends_on:
      migrate:
        condition: service_completed_successfully

  db-test:
    image: postgres:18.6-bookworm
    profiles: [test]
    environment:
      POSTGRES_DB: gestao_recebiveis_test
      POSTGRES_USER: gestao_recebiveis
      POSTGRES_PASSWORD: gestao_recebiveis_test_only
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gestao_recebiveis -d gestao_recebiveis_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    networks: [gestao_recebiveis]

  test:
    <<: *backend
    profiles: [test]
    environment:
      <<: *backend-env
      DATABASE_URL: postgresql+psycopg://gestao_recebiveis:gestao_recebiveis_test_only@db-test:5432/gestao_recebiveis_test
      SESSION_SECRET: gestao_recebiveis_test_session_secret_not_for_production_123456
      DEMO_MODE: "true"
    command: [sh, /scripts/check-backend.sh]
    depends_on:
      db-test:
        condition: service_healthy

  frontend-checks:
    image: gestao-recebiveis-frontend-checks:local
    profiles: [test]
    build:
      context: ./frontend
      target: checks
      args:
        API_INTERNAL_URL: http://api:8101
    networks: [gestao_recebiveis]

  e2e:
    image: gestao-recebiveis-e2e:local
    profiles: [test]
    build:
      context: ./frontend
      dockerfile: Dockerfile.e2e
    environment:
      BASE_URL: http://localhost:3101
      PLAYWRIGHT_OUTPUT_DIR: /artifacts
    network_mode: service:frontend
    volumes:
      - ./artifacts/e2e:/artifacts
    depends_on:
      frontend:
        condition: service_healthy

volumes:
  postgres-data:

networks:
  gestao_recebiveis:
