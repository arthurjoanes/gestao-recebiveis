<svg xmlns="http://www.w3.org/2000/svg" width="840" height="224" viewBox="0 0 840 224" role="img" aria-labelledby="title desc">
  <title id="title">Paleta da marca Recebíveis</title>
  <desc id="desc">Azul profundo #152C49, Azul ação #1E57A4, Verde caixa #226B4B, Âmbar atenção #8A5900, Rubi vencido #A3323C, Névoa #F0F2F5 e Branco #FFFFFF.</desc>
  <g font-family="Arial,sans-serif" font-size="16" fill="#FFFFFF">
    <rect width="210" height="112" fill="#152C49"/>
    <text x="16" y="72">Azul profundo</text><text x="16" y="96" font-size="14">#152C49</text>
    <rect x="210" width="210" height="112" fill="#1E57A4"/>
    <text x="226" y="72">Azul ação</text><text x="226" y="96" font-size="14">#1E57A4</text>
    <rect x="420" width="210" height="112" fill="#226B4B"/>
    <text x="436" y="72">Verde caixa</text><text x="436" y="96" font-size="14">#226B4B</text>
    <rect x="630" width="210" height="112" fill="#8A5900"/>
    <text x="646" y="72">Âmbar atenção</text><text x="646" y="96" font-size="14">#8A5900</text>
    <rect y="112" width="280" height="112" fill="#A3323C"/>
    <text x="16" y="184">Rubi vencido</text><text x="16" y="208" font-size="14">#A3323C</text>
    <rect x="280" y="112" width="280" height="112" fill="#F0F2F5"/>
    <text x="296" y="184" fill="#172B49">Névoa</text><text x="296" y="208" font-size="14" fill="#172B49">#F0F2F5</text>
    <rect x="560.5" y="112.5" width="279" height="111" fill="#FFFFFF" stroke="#D0D6DF"/>
    <text x="576" y="184" fill="#172B49">Branco</text><text x="576" y="208" font-size="14" fill="#172B49">#FFFFFF</text>
  </g>
</svg>
