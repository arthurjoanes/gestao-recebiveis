name: pf-gestao-recebiveis-proof

x-backend: &backend
  image: gestao-recebiveis-backend:local
  init: true
  environment: &environment
    DATABASE_URL: postgresql+psycopg://gestao_recebiveis:proof_local_only@db:5432/gestao_recebiveis_proof_test
    SESSION_SECRET: gestao_recebiveis_disposable_proof_secret_not_for_deployment_123456
    DEMO_MODE: "true"
    FRONTEND_ORIGIN: http://localhost:3101
    COOKIE_SECURE: "false"
    LEASE_SECONDS: "3"
    HEARTBEAT_SECONDS: "1"
    CF_PROOF_MODE: "isolated"

services:
  db:
    image: postgres:18.6-bookworm
    environment:
      POSTGRES_DB: gestao_recebiveis_proof_test
      POSTGRES_USER: gestao_recebiveis
      POSTGRES_PASSWORD: proof_local_only
    volumes:
      - proof-postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U gestao_recebiveis -d gestao_recebiveis_proof_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  probe:
    <<: *backend
    volumes:
      - ${CF_PROOF_EVIDENCE_DIR:?Use scripts/prove.ps1}:/evidence
    command: [python, tests/persistence_probe.py, verify]
  api:
    <<: *backend
    command: [uvicorn, "gestao_recebiveis.app:app", --host, "0.0.0.0", --port, "8101"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/health/ready', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
  worker:
    <<: *backend
    command: [python, -m, gestao_recebiveis.worker]
  frontend:
    image: gestao-recebiveis-frontend:local
    init: true
    environment:
      API_INTERNAL_URL: http://api:8101
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3101').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
  e2e:
    image: gestao-recebiveis-e2e:local
    environment:
      BASE_URL: http://localhost:3101
      PLAYWRIGHT_OUTPUT_DIR: /artifacts
    network_mode: service:frontend
    volumes:
      - ./artifacts/proof-e2e:/artifacts

volumes:
  proof-postgres:
